# Fresh randomness for the notify credential's temp-file suffix
# (`save_notify_credential`, agent-terminal-21) — mirrors
# `crates/mdview/src/terminal_auth.rs`'s token-writer, which already depends
# on this crate at the workspace level. Not an async runtime, so it does not
# touch the `no_web_framework_dependency_declared` guard below.
rand.workspace = true

[dev-dependencies]
# paths_boundary.rs (agent-terminal-2) tests build temp directories; this
# crate stays async-runtime-free (no tokio/axum/hyper — see
# `bee::tests::no_web_framework_dependency_declared`).
tempfile = "3"
